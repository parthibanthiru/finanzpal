# Checks the Finanzpal app (mobile/) on every change, so errors show up without manual testing:
# installs the packages, checks they match the Expo SDK and the website data sync,
# runs the full TypeScript check, renders every screen (Jest) and builds the Android and iOS
# JavaScript bundles.
# Failures are also posted as annotations on the commit (see mobile/tools/ci-step.sh).
name: Mobile app check

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'data/**'
      - 'assets/*rechner.js'
      - 'assets/haushaltsbuch.js'
      - 'assets/finanz-check.js'
      - 'assets/insurance-tabs.js'
      - 'assets/*-compare.js'
      - 'assets/compare.js'
      - 'assets/etf-search.js'
      - '*.html'
      - 'en/*.html'
      - '.github/workflows/mobile-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        id: install
        run: tools/ci-step.sh "npm install" npm install --no-audit --no-fund

      # Report-only: versions are pinned in package.json to the SDK's tested set
      # (fixing them here would rewrite node_modules while the Expo CLI is running).
      - name: Package versions match the Expo SDK
        id: align
        run: tools/ci-step.sh "expo install --check - fix locally with npx expo install --fix" npx expo install --check

      - name: Report resolved versions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          versions="$(node -e '
            const p=require("./package.json");
            const out={};
            for (const n of Object.keys({...p.dependencies,...p.devDependencies})) {
              try { out[n]=require(require.resolve(n+"/package.json",{paths:[process.cwd()]})).version } catch { out[n]="?" }
            }
            console.log(Object.entries(out).map(([k,v])=>k+"@"+v).join(", "));
          ')"
          echo "::notice title=Resolved package versions::${versions}"

      - name: Website data in sync
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          tools/ci-step.sh "sync-data" node tools/sync-data.mjs
          tools/ci-step.sh "mobile/data out of date (run: cd mobile && npm run sync-data)" git diff --exit-code -- data

      - name: TypeScript check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/ci-step.sh "TypeScript" npx tsc --noEmit --pretty false

      # Renders every screen in German/English, light/dark, plus the main flows (__tests__/)
      - name: Screen tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx jest --ci --silent --json --outputFile="$RUNNER_TEMP/jest.json" || true
          tools/ci-step.sh "Screen tests" node tools/jest-summary.mjs "$RUNNER_TEMP/jest.json"

      # Push sender (tools/notify-new-data.mjs): what counts as news, message texts, summary
      - name: Push sender tests
        if: ${{ !cancelled() }}
        run: tools/ci-step.sh "Push sender tests" node --test tools/notify-new-data.test.mjs

      - name: Build Android bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/ci-step.sh "Android bundle" npx expo export --platform android --output-dir "$RUNNER_TEMP/export-android"

      - name: Build iOS bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tools/ci-step.sh "iOS bundle" npx expo export --platform ios --output-dir "$RUNNER_TEMP/export-ios"

      - name: Expo doctor (advice only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          status=0
          out="$(npx expo-doctor 2>&1)" || status=$?
          echo "$out"
          if [ $status -ne 0 ]; then
            echo "::warning title=expo-doctor::$(echo "$out" | tail -n 60 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"
          fi
